# .github/workflows/testes.yml — testes de GUI sem tela no GitHub Actions
name: testes
on: [push, pull_request]

jobs:
  testes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen          # sem servidor gráfico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: python -m pip install PyQt6==6.12.0 pytest pytest-qt pytest-cov
      - name: Testes com cobertura
        run: python -m pytest -v --cov=src --cov-report=xml
