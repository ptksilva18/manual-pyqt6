[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-engenharia"
version = "0.1.0"
description = "Aplicação desktop de cálculos de engenharia com PyQt6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.12,<6.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "mypy>=1.10"]

[project.gui-scripts]
calc-engenharia = "calc_engenharia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
